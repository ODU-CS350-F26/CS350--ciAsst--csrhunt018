plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    ignoreFailures = true
    useJUnitPlatform()
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

task copyDocs(type: Copy, dependsOn: 'javadoc') {
    from 'build/docs'
    into 'build/reports'
}

task generateIndexMd {
    outputs.file "build/reports/index.md"
    doLast {
        def file = new File("build/reports/index.md")
        file.text = "# CS350 CI Assignment\n\n[View Test Reports](tests/test/index.html)\n\n[View Javadoc](javadoc/index.html)\n"
    }
}

task reports(dependsOn: ['copyDocs', 'test', 'generateIndexMd']) {
    description 'Generate all reports for this project'
}